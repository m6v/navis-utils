# Полностью очистить старые правила перед загрузкой
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        # Разрешить уже установленные и доверенные соединения
        ct state established,related accept

        # Разрешить локальную петлю (loopback) для внутренних служб
        iif "lo" accept

        # Разрешить пинг (ICMP) со всех направлений
        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept

        # Разрешить SSH для всей вашей домашней/лабораторной подсети
        # Это временное правило для тестирования с любых хостов подсети
        ip saddr 192.168.1.0/24 tcp dport 22 accept

        # Разрешить полноценный доступ инструктору (192.168.1.10) к SSH и VNC
        ip saddr 192.168.1.10 tcp dport 22 accept
        ip saddr 192.168.1.10 tcp dport 5900-5920 accept

        # Опционально: Разрешить SSH для самого администратора (с управляющего узла Ansible)
        # Если вы запускаете Ansible не с компьютера инструктора, раскомментируйте строку ниже:
        # tcp dport 22 accept
    }

    chain forward {
        type filter hook forward priority filter; policy accept;
        # Трафик внутри мостов ходит свободно, Libvirt сам допишет сюда правила NAT для extnet
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
