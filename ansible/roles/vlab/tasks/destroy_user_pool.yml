---
- name: Поиск файлов оверлейных дисков в пользовательском пуле хранения
  find:
    paths: "{{ user_pool_path }}"
    patterns: "*.qcow2"
  register: user_images
  # Не падать с ошибкой, если каталог отсутствует
  failed_when: false

- name: Формирование списка имен доменов для удаления
  set_fact:
    # Извлечение имен доменов на основе файлов с образами дисков в пуле пользователя
    user_domains: "{{ user_images.files | default([]) | map(attribute='path') | map('basename') | map('regex_replace', '\\.qcow2$', '') | list }}"

- name: Принудительная остановка доменов пользователя (если запущены)
  command: "virsh destroy {{ item }}"
  loop: "{{ user_domains }}"
  failed_when: false

- name: Полное удаление конфигурации доменов пользователя
  command: "virsh undefine {{ item }} --nvram"
  loop: "{{ user_domains }}"
  failed_when: false

- name: Проверка наличия пользовательского пула
  command: "virsh pool-info {{ user_pool_name }}"
  register: pool_check
  failed_when: false
  changed_when: false

- name: Принудительная остановка и удаление пользовательского пула
  command: "{{ item }}"
  with_items:
    - "virsh pool-destroy {{ user_pool_name }}"
    - "virsh pool-undefine {{ user_pool_name }}"
  when: pool_check.rc == 0
  failed_when: false

- name: Принудительное удаление каталога пользовательского пула со всеми оверлеями
  file:
    path: "{{ user_pool_path }}"
    state: absent

- name: Определение пути к рабочему столу обучаемого
  # При выполнении задачи будет предупреждение, это нормально!
  command: "xdg-user-dir DESKTOP"
  become: true
  become_user: "{{ user }}"
  register: xdg_desktop_path
  changed_when: false
  failed_when: false

- name: Установка дефолтного пути, если xdg-user-dir не вернул результат
  set_fact:
    desktop_path: "{{ xdg_desktop_path.stdout | default('/home/' ~ user ~ '/Desktop') }}"

- name: Поиск ярлыков на рабочем столе обучаемого, содержащих маркер vlab
  shell: "grep -l 'X-Related-To=vlab' {{ desktop_path }}/*.desktop 2>/dev/null"
  register: vlab_shortcuts
  failed_when: false
  changed_when: false

- name: Удаление ярлыков, содержащих маркер vlab
  file:
    path: "{{ item }}"
    state: absent
  loop: "{{ vlab_shortcuts.stdout_lines }}"
  loop_control:
    label: "{{ item | basename }}"
