---
- name: Установка режима сборки initrd.img MODULES=dep
  lineinfile:
    path: /etc/initramfs-tools/initramfs.conf
    regexp: '^MODULES='
    line: 'MODULES=dep'
    state: present

- name: Установка быстрого сжатия COMPRESS=lz4 при сборке initrd.img
  lineinfile:
    path: /etc/initramfs-tools/initramfs.conf
    regexp: '^COMPRESS='
    line: 'COMPRESS=lz4'
    state: present
    
- name: Установка QEMU/KVM
  apt:
    name:
      - qemu-kvm
      - libvirt-daemon-system
      - virt-manager
    state: present
  
- name: Остановка и отключение сети default
  shell: |
    virsh net-destroy default 2>/dev/null || true
    virsh net-undefine default 2>/dev/null || true
  # Чтобы Ansible не считал этот шаг изменением при каждом запуске
  changed_when: false

- name: Удаление конфигурационных файлов сети default
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/libvirt/qemu/networks/autostart/default.xml
    - /etc/libvirt/qemu/networks/default.xml

- name: Копирование XML-шаблонов во временный каталог
  template:
    src: "templates/{{ item }}.xml"
    dest: "/tmp/{{ item }}.xml"
    mode: '0644'
  loop: "{{ virtual_networks }}"

- name: Регистрация, запуск и добавление сетей в автозагрузку
  # Заглушки || true подавляют ошибки при повторном запуске задачи
  shell: |
    virsh net-define "/tmp/{{ item }}.xml"
    virsh net-start "{{ item }}" || true
    virsh net-autostart "{{ item }}" || true
    rm -f "/tmp/{{ item }}.xml"
  loop: "{{ virtual_networks }}"
  changed_when: true

- name: Добавление текущего пользователя в группы виртуализации
  user:
    name: "{{ ansible_user }}"
    groups:
      - kvm
      - libvirt
      - libvirt-admin
    append: yes

- name: Проверка изменений и сборка distros.iso
  shell: |
    cd "{{ role_path }}/files"
    is_changes=$(find distros -type f -newer images/distros.iso -print -quit 2>/dev/null)
    if ! [ -f images/distros.iso ] || [ -n "$is_changes" ]; then
      genisoimage -input-charset utf-8 -r -J -joliet-long -U -o images/distros.iso distros && \
      touch images/distros.iso
      echo "changed"
    fi
  register: iso_build_result
  delegate_to: localhost
  become: false
  changed_when: iso_build_result.stdout == "changed"

- name: Копирование образов виртуальных машин из files/images в системный пул
  synchronize:
    # Слэш на конце src задает копирование содержимого каталога, а не самого каталога
    src: files/images/
    dest: "{{ system_pool_path }}/"
    recursive: yes
    delete: no
    archive: yes

- name: Настройки дефолтного пула хранения (рабочий вариант для Astra Linux)
  shell: |
    sg libvirt -c "virsh pool-define-as {{ system_pool_name }} dir --target {{ system_pool_path }} 2>/dev/null || true"
    sg libvirt -c "virsh pool-start {{ system_pool_name }} 2>/dev/null || true"
    sg libvirt -c "virsh pool-autostart {{ system_pool_name }} 2>/dev/null || true"
  changed_when: false

- name: Копирование иконок из files/icons в системный каталог
  synchronize:
    # Слэш на конце src задает копирование содержимого каталога, а не самого каталога
    src: files/icons/
    dest: "/usr/share/pixmaps/"
    recursive: yes
    delete: no
    archive: yes
