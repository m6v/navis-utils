---
- name: Оркестрация создания учетной записи обучаемого
  hosts: "{{ host }}"
  become: true

  # Сначала проверяем ввод и спрашиваем пароли на localhost
  pre_tasks:
    - name: Валидация входных параметров (наличие host и user)
      fail:
        msg: "Ошибка! Не задан параметр host и/или user. Пример: -e 'host=lws-01 user=ivanov'"
      when: (user is not defined) or (host is not defined)
      run_once: true # Достаточно проверить один раз, а не для каждого хоста

    - name: Проверка наличия хоста в файле инвентаря
      fail:
        msg: "Ошибка! Хост '{{ host }}' не найден в вашем файле инвентаря"
      when: host not in groups['all']

    - name: Проверка наличия пользователя на целевом хосте
      getent:
        database: passwd
        key: "{{ user }}"
        fail_key: false

    - name: Фиксация факта существования пользователя
      set_fact:
        is_user_exist: "{{ getent_passwd[user] is defined and getent_passwd[user] is sequence }}"

    - name: Интерактивный запрос пароля для нового ученика
      pause:
        prompt: "Введите пароль для создания пользователя {{ user }} на хосте {{ inventory_hostname }}"
        echo: false
      register: password_input
      delegate_to: localhost
      become: false
      # Запрос пароля только если пользователь не зарегистрирован
      when: not is_user_exist

    - name: Интерактивный запрос подтверждения пароля
      pause:
        prompt: "Повторите пароль для подтверждения"
        echo: false
      register: password_confirm
      delegate_to: localhost
      become: false
      # Запрос подтверждения пароля только если пользователь не зарегистрирован
      when: not is_user_exist

    - name: Проверка совпадения введенных паролей
      fail:
        msg: "Ошибка! Введенные пароли не совпадают. Перезапустите плейбук"
      when: 
        - not is_user_exist
        - password_input.user_input != password_confirm.user_input

  roles:
    - role: users
      vars:
        user_action: create
        # Передача пароля, только если он был введен, иначе пустого значения/omit
        user_password: "{{ password_input.user_input if not is_user_exist else omit }}"
