---
- name: Оркестрация создания учетной записи обучаемого
  hosts: all
  become: true
  gather_facts: false
  any_errors_fatal: false

  pre_tasks:
    - name: Валидация входных параметров (наличие user)
      fail:
        msg: "Ошибка! Не задан параметр user. Пример в скрипте: -e 'user=ivanov'"
      when: user is not defined or user | length == 0
      run_once: true

    - name: Проверка наличия пользователя на целевом хосте
      getent:
        database: passwd
        key: "{{ user }}"
        fail_key: false

    - name: Фиксация факта существования пользователя
      set_fact:
        is_user_exist: "{{ getent_passwd[user] is defined and getent_passwd[user] is sequence }}"

    # Интерактивный запрос пароля для нового обучаемого
    - name: Интерактивный запрос пароля для нового обучаемого
      pause:
        prompt: "Введите пароль пользователя {{ user }}, создаваемого на выбранных хостах"
        echo: false
      register: entered_password
      delegate_to: localhost
      become: false
      run_once: true

    - name: Интерактивный запрос подтверждения пароля
      pause:
        prompt: "Повторите пароль для подтверждения"
        echo: false
      register: confirmed_password
      delegate_to: localhost
      become: false
      run_once: true

    - name: Проверка совпадения введенных паролей
      fail:
        msg: "Ошибка! Введенные пароли не совпадают. Перезапустите плейбук"
      when: entered_password.user_input != confirmed_password.user_input
      run_once: true

    # Использовать введенный пароль на всех целевых хостах в сессии
    - name: Проброс пароля на все целевые хосты
      set_fact:
        shared_password: "{{ hostvars[ansible_play_hosts[0]]['entered_password']['user_input'] | default(omit) }}"

  roles:
    - role: users
      vars:
        user_action: create
        user_password: "{{ shared_password if not is_user_exist else omit }}"
