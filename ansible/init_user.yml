---
- name: Management of learner accounts on Astra Linux SE 1.7
  hosts: "{{ host | default('learners') }}"
  become: true
  vars:
    # Имя пользователя берется из переданной переменной `user`
    username: "{{ user }}"
    
    # Путь к персональному каталогу хранения в домашней папке ученика
    pool_path: "/home/{{ user }}/.local/libvirt/images"

    # Путь к дефолтному пулу, где лежат базовые шаблоны
    base_images_path: "/var/lib/libvirt/images"

  pre_tasks:
    - name: Валидация входных параметров (наличие host и user)
      fail:
        msg: "Ошибка! Вы должны передать параметры host и user. Пример: -e 'host=lws-01 user=ivanov'"
      when: (user is not defined) or (host is not defined)
      tags: always

    - name: Проверка, что указанный хост существует в файле инвентаря
      fail:
        msg: "Ошибка! Хост '{{ host }}' не найден в вашем файле инвентаря. Проверьте правильность написания."
      when: host not in groups['all']
      tags: always

  tasks:
    - name: Проверка, существует ли уже обучаемый в операционной системе
      getent:
        database: passwd
        key: "{{ username }}"
      register: user_check
      # Запрещаем Ansible аварийно завершать работу, если пользователя нет
      failed_when: false
      changed_when: false
      tags: always

    - name: Логирование статуса пользователя
      debug:
        msg: "Пользователь {{ username }} уже создан. Пропускаем создание и ввод пароля."
      # Выполняем, если getent_passwd был успешно создан в памяти (пользователь найден)
      when: user_check.ansible_facts.getent_passwd is defined
      tags: always

    - name: Интерактивный запрос пароля для нового ученика
      pause:
        prompt: "Введите пароль пользователя {{ inventory_hostname }}"
        echo: false
      register: password_input
      # Выполняем запрос локально на вашем ПК, чтобы клавиатура работала
      delegate_to: localhost
      # Запускаем от имени вашего текущего локального пользователя (без sudo)
      become: false
      # Запрашиваем, если getent_passwd не определен (пользователя нет в системе)
      when: hostvars[inventory_hostname].user_check.ansible_facts.getent_passwd is not defined
      tags: always

    - name: Интерактивный запрос подтверждения пароля
      pause:
        prompt: "Повторите пароль для подтверждения"
        echo: false
      register: password_confirm
      delegate_to: localhost
      become: false
      when: hostvars[inventory_hostname].user_check.ansible_facts.getent_passwd is not defined
      tags: always

    - name: Проверка совпадения введенных паролей
      fail:
        msg: "Ошибка! Введенные пароли не совпадают. Перезапустите плейбук."
      when: 
        - hostvars[inventory_hostname].user_check.ansible_facts.getent_passwd is not defined
        - password_input.user_input != password_confirm.user_input
      tags: always

    - name: Создание учетной записи обучаемого (без установки пароля)
      user:
        name: "{{ username }}"
        # Группы виртуализации Astra Linux SE (без группы sudo)
        groups:
          - kvm
          - libvirt
          - libvirt-qemu
          - libvirt-admin
        append: yes
        shell: /bin/bash
        state: present
        create_home: yes
      when: user_check.ansible_facts.getent_passwd is not defined

    - name: Установка пароля пользователя силами СЗИ Astra Linux
      # Передаем чистый пароль в системную утилиту chpasswd внутри виртуалки
      shell: "echo '{{ username }}:{{ password_input.user_input }}' | chpasswd"
      # Скрываем пароль из логов в целях безопасности
      no_log: true
      when: user_check.ansible_facts.getent_passwd is not defined

    - name: Рекурсивное создание структуры каталогов .local/libvirt/images
      file:
        path: "{{ pool_path }}"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        # Права 711 позволяют системному демону libvirt заходить внутрь папки
        mode: '0711'

    - name: Проверка, зарегистрирован ли пул хранения с именем ученика в libvirt
      command: virsh pool-info {{ username }}
      register: pool_check
      failed_when: false
      changed_when: false

    - name: Регистрация, запуск и добавление персонального пула в автозагрузку
      command: "{{ item }}"
      with_items:
        - "virsh pool-define-as {{ username }} dir --target {{ pool_path }}"
        - "virsh pool-start {{ username }}"
        - "virsh pool-autostart {{ username }}"
      when: pool_check.rc != 0

    - name: Принудительное обновление пула для фиксации прав
      command: "virsh pool-refresh {{ username }}"
      failed_when: false
      changed_when: false

    - name: Поиск всех базовых образов qcow2 в системном пуле хранения
      find:
        paths: "{{ base_images_path }}"
        patterns: "*.qcow2"
      register: found_base_images

    - name: Создание оверлейных дисков для всех найденных системных шаблонов
      # Внешние одинарные кавычки экранируют регулярное выражение на 100%
      command: >
        qemu-img create -f qcow2 -F qcow2 
        -b "{{ item.path }}" 
        '{{ pool_path }}/{{ item.path | basename | regex_replace(".qcow2$", "") }}.qcow2'
      loop: "{{ found_base_images.files }}"
      args:
        creates: '{{ pool_path }}/{{ item.path | basename | regex_replace(".qcow2$", "") }}.qcow2'
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Восстановление прав владельца на созданные оверлейные диски
      file:
        path: "{{ pool_path }}"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        recurse: yes

    - name: Принудительное обновление персонального пула Libvirt
      command: "virsh pool-refresh {{ username }}"
      failed_when: false
      changed_when: false

    - name: Генерация уникальных XML-конфигураций ВМ из шаблонов для ученика
      template:
        src: 'templates/{{ item.path | basename | regex_replace(".qcow2$", "") }}.xml'
        dest: '/tmp/{{ item.path | basename | regex_replace(".qcow2$", "") }}.xml'
        owner: root
        group: root
        mode: '0644'
      loop: "{{ found_base_images.files }}"
      loop_control:
        label: "{{ item.path | basename | regex_replace('.qcow2$', '') }}.xml"

    - name: Принудительное удаление старой регистрации ВМ (если окружение сбрасывается)
      command: 'virsh undefine {{ item.path | basename | regex_replace(".qcow2$", "") }} --nvram'
      loop: "{{ found_base_images.files }}"
      failed_when: false
      loop_control:
        label: "{{ item.path | basename | regex_replace('.qcow2$', '') }}"

    - name: Регистрация (определение) виртуальных машин в гипервизоре Libvirt
      command: 'virsh define /tmp/{{ item.path | basename | regex_replace(".qcow2$", "") }}.xml'
      loop: "{{ found_base_images.files }}"
      loop_control:
        label: "{{ item.path | basename | regex_replace('.qcow2$', '') }}"

    - name: Динамическое определение пути к Рабочему столу пользователя
      command: "xdg-user-dir DESKTOP"
      become_user: "{{ username }}"
      register: xdg_desktop_path
      changed_when: false
      failed_when: false

    - name: Установка альтернативного пути, если xdg-user-dir не вернул результат
      set_fact:
        final_desktop_path: "{{ xdg_desktop_path.stdout | default('/home/' ~ username ~ '/Desktop') }}"

    - name: Гарантия существования каталога Рабочего стола
      file:
        path: "{{ final_desktop_path }}"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: '0755'

    - name: Размещение ярлыков запуска для каждой созданной ВМ на Рабочем столе
      template:
        src: templates/shortcut.desktop.tmpl
        dest: '{{ final_desktop_path }}/run_{{ item.path | basename | regex_replace(".qcow2$", "") }}.desktop'
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: '0755'
      vars:
        # 1. Считываем файл XML как текст
        xml_content: "{{ lookup('file', 'templates/' ~ (item.path | basename | regex_replace('.qcow2$', '')) ~ '.xml') }}"
        
        # 2. Пытаемся вырезать всё, что находится между тегами <title>...</title>
        # Если тег найден, в переменную запишется только текст заголовка. 
        # Если тега нет, регулярное выражение не сработает, и запишется весь XML-текст целиком.
        parsed_title: "{{ xml_content | regex_replace('(?s).*<title>(.*?)</title>.*', '\\1') }}"
        
        # 3. Делаем проверку: если в parsed_title остался исходный XML-код (начинается с <), 
        # значит тега <title> не было. В этом случае подставляем чистое имя файла.
        vm_title: "{{ item.path | basename | regex_replace('.qcow2$', '') if parsed_title.startswith('<') else parsed_title }}"
        
        # Имя иконки в точности соответствует имени ВМ
        vm_icon: '{{ (item.path | basename | regex_replace(".qcow2$", "")) ~ ".png" }}'
      loop: "{{ found_base_images.files }}"
      loop_control:
        label: "run_{{ item.path | basename | regex_replace('.qcow2$', '') }}.desktop"
