---
- name: Инициализация учетных записей обучаемых на рабочих местах УТК-СЗИ
  hosts: "{{ host | default('learners') }}"
  become: true
  vars:
    # Имя пользователя взять из переданной переменной `user`
    username: "{{ user }}"

    # Имя пользовательского пула хранения в Libvirt (совпадает с именем пользователя)
    user_pool_name: "{{ user }}"
    
    # Путь к пользовательскому каталогу хранения в домашней папке обучваемого
    user_pool_path: "/home/{{ user }}/.local/libvirt/images"

    # Путь к дефолтному пулу с базовыми шаблонами
    system_pool_path: "/var/lib/libvirt/images"

  pre_tasks:
    - name: Валидация входных параметров (наличие host и user)
      fail:
        msg: "Ошибка! Не задан параметр host и/или user. Пример: -e 'host=lws-01 user=ivanov'"
      when: (user is not defined) or (host is not defined)
      tags: always

    - name: Проверка, что указанный хост существует в файле инвентаря
      fail:
        msg: "Ошибка! Хост '{{ host }}' не найден в вашем файле инвентаря. Проверьте правильность написания."
      when: host not in groups['all']

  tasks:
    - name: Проверка наличия учетной записи обучаемого на целевом хосте
      getent:
        database: passwd
        key: "{{ username }}"
      register: user_check
      failed_when: false
      changed_when: false

    - name: Логирование статуса пользователя
      debug:
        msg: "Пользователь {{ username }} создан, пропускаем создание и ввод пароля"
      when: user_check.ansible_facts.getent_passwd is defined

    - name: Интерактивный запрос пароля для нового ученика
      pause:
        prompt: "Введите пароль пользователя {{ inventory_hostname }}"
        echo: false
      register: password_input
      delegate_to: localhost
      become: false
      when: hostvars[inventory_hostname].user_check.ansible_facts.getent_passwd is not defined

    - name: Интерактивный запрос подтверждения пароля
      pause:
        prompt: "Повторите пароль для подтверждения"
        echo: false
      register: password_confirm
      delegate_to: localhost
      become: false
      when: hostvars[inventory_hostname].user_check.ansible_facts.getent_passwd is not defined

    - name: Проверка совпадения введенных паролей
      fail:
        msg: "Ошибка! Введенные пароли не совпадают. Перезапустите плейбук."
      when: 
        - hostvars[inventory_hostname].user_check.ansible_facts.getent_passwd is not defined
        - password_input.user_input != password_confirm.user_input

    - name: Создание учетной записи обучаемого
      user:
        name: "{{ username }}"
        groups:
          - kvm
          - libvirt
          - libvirt-qemu
          - libvirt-admin
        append: yes
        shell: /bin/bash
        state: present
        create_home: yes
      when: user_check.ansible_facts.getent_passwd is not defined

    - name: Установка пароля учетной записи обучаемого
      shell: "echo '{{ username }}:{{ password_input.user_input }}' | chpasswd"
      no_log: true
      when: user_check.ansible_facts.getent_passwd is not defined

    - name: Рекурсивное создание структуры каталогов для пользовательского пула
      file:
        path: "{{ user_pool_path }}"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: '0711'

    - name: Проверка, зарегистрирован ли пул хранения с именем обучаемого
      command: virsh pool-info {{ user_pool_name }}
      register: pool_check
      failed_when: false
      changed_when: false

    - name: Регистрация, запуск и добавление пользовательского пула в автозагрузку
      command: "{{ item }}"
      with_items:
        - "virsh pool-define-as {{ user_pool_name }} dir --target {{ user_pool_path }}"
        - "virsh pool-start {{ user_pool_name }}"
        - "virsh pool-autostart {{ user_pool_name }}"
      when: pool_check.rc != 0

    - name: Принудительное обновление пула
      command: "virsh pool-refresh {{ user_pool_name }}"
      failed_when: false
      changed_when: false

    - name: Поиск всех базовых образов qcow2 в системном пуле хранения
      find:
        paths: "{{ system_pool_path }}"
        patterns: "*.qcow2"
      register: base_images

    - name: Формирование списка имен виртуальных машин для учебного класса
      set_fact:
        user_domains: "{{ base_images.files | map(attribute='path') | map('basename') | map('regex_replace', '\\.qcow2$', '') | list }}"

    - name: Создание оверлейных дисков в пользовательском пуле для всех базовых образов qcow2
      command: >
        qemu-img create -f qcow2 -F qcow2 
        -b "{{ system_pool_path }}/{{ item }}.qcow2" 
        "{{ user_pool_path }}/{{ item }}.qcow2"
      loop: "{{ user_domains }}"
      args:
        creates: "{{ user_pool_path }}/{{ item }}.qcow2"

    - name: Восстановление прав владельца на созданные оверлейные диски
      file:
        path: "{{ user_pool_path }}"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        recurse: yes

    - name: Принудительное обновление пользовательского пула Libvirt
      command: "virsh pool-refresh {{ user_pool_name }}"
      failed_when: false
      changed_when: false

    - name: Генерация XML-конфигураций виртуальных машин из шаблонов
      template:
        src: "templates/{{ item }}.xml"
        dest: "/tmp/{{ item }}.xml"
        owner: root
        group: root
        mode: '0644'
      loop: "{{ user_domains }}"

    - name: Принудительное удаление виртуальных машин
      command: "virsh undefine {{ item }} --nvram"
      loop: "{{ user_domains }}"
      failed_when: false

    - name: Регистрация (определение) виртуальных машин
      command: "virsh define /tmp/{{ item }}.xml"
      loop: "{{ user_domains }}"

    - name: Динамическое определение пути к каталогу рабочего стола пользователя
      command: "xdg-user-dir DESKTOP"
      become_user: "{{ username }}"
      register: xdg_desktop_path
      changed_when: false
      failed_when: false

    - name: Установка дефолтного пути, если xdg-user-dir не вернул результат
      set_fact:
        final_desktop_path: "{{ xdg_desktop_path.stdout | default('/home/' ~ username ~ '/Desktop') }}"

    - name: Гарантия существования каталога Рабочего стола
      file:
        path: "{{ final_desktop_path }}"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: '0755'

    - name: Размещение ярлыков запуска виртуальных машин на рабочем столе
      template:
        src: templates/shortcut.desktop.tmpl
        dest: "{{ final_desktop_path }}/run_{{ item }}.desktop"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: '0755'
      vars:
        # Если регулярный поиск не нашёл тег <title>, default(item, true) подставит имя виртуальной машины
        vm_title: "{{ lookup('file', 'templates/' ~ item ~ '.xml') | regex_search('<title>(.*?)</title>', '\\1') | first | default(item, true) }}"
        vm_icon: "{{ item }}.png"
      loop: "{{ user_domains }}"
